<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onhand Prototype</title>
  <link rel="stylesheet" href="prototype-style.css">
</head>
<body>


  <header class="main-header">


    <a class="logo" href="prototype.html">
  <img src="images/logo.png" alt="OnHand Logo">
</a>


    <nav class="nav-links">
    <a href="#">LOGIN IN</a>
    <a href="#">SIGN UP</a>
     <div class="dropdown-container">
    <!-- The Checkbox Hack elements -->
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">
    <label for="menu-toggle" class="dropdown-trigger">MENU ▾</label>
   
    <!-- The form structure acts as our search system natively -->
    <form action="" method="GET" class="dropdown-menu">
      <div class="search-box">
        <!-- 'name="query"' creates the ?query=text URL parameter naturally -->
        <input type="text" name="query" placeholder="Search for something...">
        <button type="submit">Go</button>
      </div>
     
      <!-- Native CSS option buttons styled neatly like lists -->
      <div class="dropdown-list">
        <button type="submit" name="query" value="Plumber" class="search-btn-link">Plumbers</button>
        <button type="submit" name="query" value="Electrician" class="search-btn-link">Electricians</button>
        <button type="submit" name="query" value="Carpenter" class="search-btn-link">Carpenters</button>
        <button type="submit" name="query" value="Painter" class="search-btn-link">Painters</button>
      </div>
    </form>
  </div>
</nav>
</header>


 
  <section class="hero-banner">
    <h2>Check out our Top Providers of This Month!</h2>
  </section>


  <!-- Artisan Request Section -->
  <section class="artisan-section">
    <h3>REQUEST AN ARTISAN</h3>
    <div class="artisan-grid">
      <!-- 9 Placeholder squares from the wireframe -->
      <div class="square-card"></div>
      <div class="square-card"></div>
      <div class="square-card"></div>
      <div class="square-card"></div>
      <div class="square-card"></div>
      <div class="square-card"></div>
      <div class="square-card"></div>
      <div class="square-card"></div>
      <div class="square-card"></div>
    </div>
  </section>


  <!-- Split Content Section -->
  <div class="split-container">
    <section class="jobs-section">
      <h3>POPULAR HOUSEHOLD JOBS</h3>
    </section>
   
    <section class="map-section">
      <div class="map-placeholder">LOCAL MAP</div>
    </section>
  </div>


  <!-- Footer -->
  <footer class="main-footer">
    <a href="#">Contact</a>


    <br><br>
    <a href="index.html">Back to Proposal</a>
  </footer>


</body>
</html>
